name: bma-nfe-mehe

x-nfe: &nfe
  image: ${NFE_IMAGE:-bma-nfe:mehe}
  pull_policy: never
  entrypoint: [/bin/sh, /code/compose/mehe/app-entrypoint.sh]
  env_file:
    - ${MEHE_ENV_FILE:-.env.mehe}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.mehe
    DJANGO_READ_DOT_ENV_FILE: "False"
    DJANGO_MIGRATE: "off"
    DJANGO_COLLECTSTATIC: "off"
    CELERY_BROKER_URL: redis://redis:6379/0
    NFE_FILE_SHARE_ROOT: /mnt/nfe-media
    MEDIA_ROOT: /mnt/nfe-media
  volumes:
    - type: bind
      source: ${NFE_FILE_SHARE_HOST_PATH:?Set NFE_FILE_SHARE_HOST_PATH in .env.mehe}
      target: /mnt/nfe-media
      bind:
        create_host_path: false
    - staticfiles:/code/staticfiles
  restart: unless-stopped
  init: true

services:
  redis:
    image: ${NFE_REDIS_IMAGE:-redis:7.4-alpine}
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  django:
    <<: *nfe
    command: [gunicorn, config.wsgi:application, --bind, "0.0.0.0:8000", --workers, "${NFE_WEB_WORKERS:-2}", --timeout, "120", --access-logfile, "-"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'Host':'${MEHE_HOST:-172.16.2.101}', 'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  celeryworker:
    <<: *nfe
    command: [celery, -A, student_registration.taskapp.celery, worker, -Q, default, --concurrency, "${NFE_WORKER_CONCURRENCY:-2}", --loglevel, INFO, --hostname, "worker@%h"]
    depends_on:
      redis:
        condition: service_healthy

  exportworker:
    <<: *nfe
    command: [celery, -A, student_registration.taskapp.celery, worker, -Q, mscc_export, --concurrency, "1", --loglevel, INFO, --hostname, "exports@%h"]
    depends_on:
      redis:
        condition: service_healthy

  celerybeat:
    <<: *nfe
    command: [celery, -A, student_registration.taskapp.celery, beat, --loglevel, INFO, --schedule, /var/lib/nfe-beat/celerybeat]
    volumes:
      - type: bind
        source: ${NFE_FILE_SHARE_HOST_PATH:?Set NFE_FILE_SHARE_HOST_PATH in .env.mehe}
        target: /mnt/nfe-media
        bind:
          create_host_path: false
      - staticfiles:/code/staticfiles
      - beatdata:/var/lib/nfe-beat
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: ${NFE_NGINX_IMAGE:-nginx:stable-alpine}
    ports:
      - "${MEHE_BIND_ADDRESS:-0.0.0.0}:${MEHE_HTTPS_PORT:-443}:443"
    volumes:
      - ./compose/mehe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${MEHE_TLS_CERT_FILE:?Set MEHE_TLS_CERT_FILE in .env.mehe}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEHE_TLS_KEY_FILE:?Set MEHE_TLS_KEY_FILE in .env.mehe}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NFE_FILE_SHARE_HOST_PATH:?Set NFE_FILE_SHARE_HOST_PATH in .env.mehe}
        target: /mnt/nfe-media
        read_only: true
        bind:
          create_host_path: false
      - staticfiles:/srv/static:ro
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staticfiles:
  redisdata:
  beatdata:
