{% extends "account/base.html" %}
{% load util_tags %}
{% load custom_tags %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block inner %}
<div class="col-md-10 col-lg-6 col-xl-5">
    <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-lock-fill text-primary display-4 mb-3"></i>
                <h2 class="fw-bold">{% trans "Change Password" %}</h2>
            </div>

            <form method="POST" autocomplete="off" action="{% url 'account_change_password' %}" class="password_change redesign-form">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button class="btn btn-primary btn-lg fw-bold" type="submit" name="action">{% trans "Update Password" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
