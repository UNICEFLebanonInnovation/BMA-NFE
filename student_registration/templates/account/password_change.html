{% extends "account/base.html" %}
{% load util_tags %}
{% load custom_tags %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block inner %}
    <h1>{% trans "Change Password" %}</h1>

    <form method="POST" autocomplete="off" action="{% url 'account_change_password' %}" class="password_change">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors bg-blue-600 text-white hover:bg-blue-700" type="submit" name="action">{% trans "Change Password" %}</button>
    </form>
{% endblock %}
