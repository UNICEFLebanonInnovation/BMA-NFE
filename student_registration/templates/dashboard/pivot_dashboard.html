{% extends "base.html" %}
{% load util_tags %}
{% load custom_tags %}
{% load static i18n %}

{% block project_title %}Pivot Dashboard{% endblock %}

{% block content %}
<div class="app-page-title">
  <div class="page-title-wrapper">
    <div class="page-title-heading">
      <div class="page-title-head center-elem page-title-heading">
        <span class="d-inline-block pr-2">
          <i class="pe-7s-graph1"></i>
        </span>
        <span class="d-inline-block">Pivot Dashboard</span>
      </div>
    </div>
  </div>
</div>

<div id="pivot" style="margin: 20px;"></div>
{% endblock content %}

{% block extra_js %}
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.css">

<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.js"></script>

<script type="text/javascript">
  $(function(){
    const $pivot = $("#pivot");
    $pivot.html('<div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Loading data...</p></div>');

    $.getJSON("{% url 'dashboard:pivot_data' %}")
      .done(function(data){
        if (data && data.length > 0) {
          $pivot.pivotUI(data);
        } else {
          $pivot.html('<div class="alert alert-info">No data available for the pivot table.</div>');
        }
      })
      .fail(function(jqXHR, textStatus, errorThrown) {
        $pivot.html('<div class="alert alert-danger">Error loading pivot data: ' + textStatus + '</div>');
        console.error("Pivot data load failed:", textStatus, errorThrown);
      });
  });
</script>
{% endblock %}
