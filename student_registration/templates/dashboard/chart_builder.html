{% extends "base.html" %}
{% load custom_tags %}
{% load static i18n %}

{% block extra_head %}
<style>
    .chart-wrapper {
        margin-bottom: 30px;
    }
    .chart-wrapper svg {
        width: 400px;
        height: 400px;
    }
    .chart-legend {
        margin-top: 10px;
    }
    .legend-item {
        display: inline-flex;
        align-items: center;
        margin-right: 10px;
    }
    .legend-color {
        width: 12px;
        height: 12px;
        margin-right: 4px;
        display: inline-block;
    }
    .chart-loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.8);
        padding: 5px 10px;
        border-radius: 4px;
        display: none;
    }
    .chart-wrapper {
        position: relative;
    }
    .chart-wrapper.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        z-index: 1050;
        padding: 20px;
        overflow: auto;
    }
    .chart-wrapper.fullscreen svg {
        height: 80vh;
    }
    body.no-scroll {
        overflow: hidden;
    }
    #loading-indicator {
        display: none;
    }
    .tooltip {
        position: absolute;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        pointer-events: none;
        font-size: 12px;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block content %}
<section class="main-content-wrapper">
    <section id="main-content">
        <div class="title_left">
            <h3>{% trans "Chart Builder" %}</h3>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-12">
                <form id="chart-form" class="mb-4">
                    <div class="form-row align-items-end">
                        <div class="form-group col-md-3">
                            <label for="chart-type">{% trans "Chart Type" %}</label>
                            <select id="chart-type" class="form-control">
                                <option value="bar">{% trans "Bar" %}</option>
                                <option value="line">{% trans "Line" %}</option>
                                <option value="pie">{% trans "Pie" %}</option>
                            </select>
                        </div>
                        <div class="form-group col-md-5">
                            <label for="mscc-data-type">{% trans "MSCC Data Source" %}</label>
                            <div class="d-flex">
                                <select id="mscc-data-type" class="form-control mr-2">
                                    <option value="nationality">{% trans "By Nationality" %}</option>
                                    <option value="gender">{% trans "By Gender" %}</option>
                                    <option value="package_type">{% trans "By Package Type" %}</option>
                                    <option value="partner">{% trans "By Partner" %}</option>
                                    <option value="round">{% trans "By Round" %}</option>
                                    <option value="center">{% trans "By Center" %}</option>
                                    <option value="governorate">{% trans "By Governorate" %}</option>
                                    <option value="caza">{% trans "By Caza" %}</option>
                                    <option value="district">{% trans "By District" %}</option>
                                    <option value="programme_type">{% trans "By Programme Type" %}</option>
                                </select>
                                <button type="button" id="load-mscc-data" class="btn btn-secondary">{% trans "Load MSCC Data" %}</button>
                            </div>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="filter-round">{% trans "Filter by Round" %}</label>
                            <select id="filter-round" class="form-control">
                                <option value="">{% trans "All Rounds" %}</option>
                                {% for round in rounds %}
                                <option value="{{ round.name }}">{{ round.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <label for="chart-data">{% trans "Data (JSON)" %}</label>
                        <textarea id="chart-data" class="form-control" rows="5">[
{"label": "A", "value": 30},
{"label": "B", "value": 80},
{"label": "C", "value": 45}
]</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">{% trans "Render" %}</button>
                </form>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="mb-3">
                    <button id="add-chart" type="button" class="btn btn-primary mr-2">{% trans "Add Chart" %}</button>
                    <button id="save-dashboard" type="button" class="btn btn-secondary">{% trans "Save Dashboard" %}</button>
                </div>
                <div id="loading-indicator">{% trans "Loading..." %}</div>
                <div id="charts-container"></div>
            </div>
        </div>
    </section>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{% static 'js/chart_builder.js' %}"></script>
{% endblock %}
