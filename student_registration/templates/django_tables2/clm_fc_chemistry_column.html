
{% load static i18n %}
{% load custom_tags %}


{% load util_tags %}
{% if record.grade_level %}
    {% if record.grade_registration == '7' or record.grade_registration == '8' or record.grade_registration == '9' %}
        <a href="{{ column.attrs.url }}{{ record.id }}{{ '/chemistry' }}" class="inline-flex items-center justify-center rounded px-4 py-2 font-medium transition-colors bg-cyan-600 text-white hover:bg-cyan-700">
            <i class="icon-synch-sign icon-white"></i>
            {% trans "Chemistry" %}
        </a>
    {% else %}
        {% trans "--" %}
    {% endif %}
{% endif %}
