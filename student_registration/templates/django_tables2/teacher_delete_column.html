{% load static i18n %}
{% load custom_tags %}

{% load util_tags %}
{% if record.owner.id == request.user.id  or  user.is_staff %}
      <button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors bg-red-600 text-white hover:bg-red-700 delete-button" itemscope="{{ record.id }}" data-action="{{ column.attrs.url }}{{ record.id }}" translation="{% trans "Are you sure you want to delete this teacher?" %}">
          <i class="icon-trash icon-white"></i>
          {% trans "Delete" %}
      </button>
{% else %}
  {% trans "Not allowed" %}
{% endif %}
