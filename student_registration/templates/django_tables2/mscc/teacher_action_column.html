{% load static i18n %}
{% load custom_tags %}
{% load util_tags %}

<div class="dropdown table-actions-dropdown">
    <button class="btn btn-light border btn-actions dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-three-dots"></i> {% trans "Actions" %}
    </button>

    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li>
            <a class="dropdown-item" href="{{ column.attrs.url_edit }}{{ record.id }}">
                <i class="bi bi-pencil-square text-primary"></i> {% trans "Edit Teacher" %}
            </a>
        </li>
        <li>
            <a class="dropdown-item text-danger delete-teacher" href="#"
               data-delete-url="{{ column.attrs.url_delete }}{{ record.id }}/"
               data-confirm-message="{% trans 'Are you sure you want to delete this teacher?' %}">
                <i class="bi bi-trash"></i> {% trans "Delete Teacher" %}
            </a>
        </li>
    </ul>
</div>
