
{% load static i18n %}
{% load custom_tags %}


{% load util_tags %}
{% if record.total_absent_days >= 40 %}
    <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium badge-danger align-text-bottom ml-1" style="padding: 10px 10px;">{{ record.total_absent_days }}</span>
{% else %}
    <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium badge-primary align-text-bottom ml-1" style="padding: 10px 10px;">{{ record.total_absent_days }}</span>
{% endif %}
