{% load static i18n %}
{% load custom_tags %}
{% load util_tags %}
<button class="inline-flex items-center rounded bg-red-600 px-4 py-2 text-white hover:bg-red-700 dropout-button" itemscope="{{ record.id }}" id="dropout_button_{{ record.id }}" translation="{% trans "Are you sure you want to tag this student as dropout?" %}">
    {% trans "Dropout" %}
</button>
<div class="dropout-date-block hidden" id="dropout_date_block_{{ record.id }}">
    <input class="block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dropout-date-input" itemscope="{{ record.id }}" id="dropout_date_{{ record.id }}" type="text" placeholder="{% trans 'Enter dropout date' %}" />
    <button class="inline-flex items-center rounded bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-700 save-dropout-button" itemscope="{{ record.id }}" id="save_dropout_button_{{ record.id }}">
        {% trans "Save" %}
    </button>
    <button class="btn btn-warning cancel-dropout-button" itemscope="{{ record.id }}" id="cancel_dropout_button_{{ record.id }}">
        {% trans "reset" %}
    </button>
</div>
