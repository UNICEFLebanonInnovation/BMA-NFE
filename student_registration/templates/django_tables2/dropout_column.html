{% load static i18n %}
{% load custom_tags %}
{% load util_tags %}
<button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors bg-red-600 text-white hover:bg-red-700 dropout-button" itemscope="{{ record.id }}" id="dropout_button_{{ record.id }}" translation="{% trans "Are you sure you want to tag this student as dropout?" %}">
    {% trans "Dropout" %}
</button>
<div class="dropout-date-block d-none" id="dropout_date_block_{{ record.id }}">
    <input class="block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dropout-date-input" itemscope="{{ record.id }}" id="dropout_date_{{ record.id }}" type="text" placeholder="{% trans 'Enter dropout date' %}" />
    <button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors bg-green-600 text-white hover:bg-green-700 save-dropout-button" itemscope="{{ record.id }}" id="save_dropout_button_{{ record.id }}">
        {% trans "Save" %}
    </button>
    <button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors btn-warning cancel-dropout-button" itemscope="{{ record.id }}" id="cancel_dropout_button_{{ record.id }}">
        {% trans "reset" %}
    </button>
</div>
