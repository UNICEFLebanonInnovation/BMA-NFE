{% load static i18n %}
{% load custom_tags %}

{% load util_tags %}
<button
    class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium transition-colors bg-red-600 text-white hover:bg-red-700 delete-button dropdown-item delete-inclusion-student"
    itemscope="{{ record.id }}"
    data-action="{{ column.attrs.url }}{{ record.id }}"
    data-registration-id="{{ record.id }}"
    data-url="{{ column.attrs.url_delete }}{{ record.id }}"
    translation="{% trans 'Are you sure you want to delete this student?' %}">

    <i class="icon-trash icon-white"></i>
    {% trans "Delete" %}
</button>
