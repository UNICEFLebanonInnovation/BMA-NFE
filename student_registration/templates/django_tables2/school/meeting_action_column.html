{% load static i18n %}
{% load custom_tags %}


{% load util_tags %}
<div class="mb-2 mr-2 btn-group dropdown" style="position: relative;">
    <button class="inline-flex items-center justify-center rounded px-4 py-2 font-medium transition-colors btn-outline-primary">Actions</button>
    <button type="button" aria-haspopup="true" aria-expanded="false" data-toggle="dropdown" class="dropdown-toggle-split dropdown-toggle inline-flex items-center justify-center rounded px-4 py-2 font-medium transition-colors btn-outline-primary"><span class="sr-only">Toggle Dropdown</span>
    </button>
    <div tabindex="-1" role="menu" aria-hidden="true" class="z-50 mt-2 min-w-[12rem] rounded-md border border-gray-200 bg-white py-1 shadow-lg" x-placement="bottom-start">

       {% if column.attrs.url_edit %}
        <a type="button" href="{{ column.attrs.url_edit }}{{ record.school_id }}/{{ record.id }}" tabindex="0" class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100">
          <button class="mb-2 mr-2 btn-icon btn-icon-only btn-pill inline-flex items-center justify-center rounded px-4 py-2 font-medium transition-colors btn-outline-info"><i class="ion-android-create btn-icon-wrapper"> </i></button>
          {% trans "Edit" %}</a>
      {% endif %}

      {% if column.attrs.url_delete %}
        <a type="button"
           href="{{ column.attrs.url_delete }}{{ record.school_id }}/{{ record.id }}/"
           tabindex="0"
           class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 delete-meeting"
           data-meeting-id="{{ record.id }}"
           data-school-id="{{ record.school_id }}">
          <button id="delete-button-{{ record.id }}" class="mb-2 mr-2 btn-icon btn-icon-only btn-pill inline-flex items-center justify-center rounded px-4 py-2 font-medium transition-colors btn-outline-info"><i class="ion-android-delete btn-icon-wrapper"> </i></button>
          {% trans "Delete" %}</a>
      {% endif %}

    </div>
</div>
