{% load static i18n %}
{% load custom_tags %}
{% load util_tags %}
{% if column.attrs.url %}
<div style="width: 100px;">

  <a href="{{ column.attrs.url }}{{ record.id }}" class="inline-flex items-center rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 col-icon">
    <i class="fa fa-list"></i>
  </a>

  <a href="{% url 'schools:club_add' record.id %}" class="inline-flex items-center rounded bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-700 col-icon">
    <i class="fa fa-plus"></i>
  </a>

</div>
{% else %}
    {% trans "Not allowed" %}
{% endif %}
