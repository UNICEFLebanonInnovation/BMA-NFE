{% load static i18n %}
{% load custom_tags %}

{% load util_tags %}
{% if column.attrs.programme|is_allowed_edit %}
   {% if record.total_absent_days >= 40 %}
      <a href="{{ column.attrs.url }}{{ record.id }}" class="inline-flex items-center rounded bg-cyan-600 px-4 py-2 text-white hover:bg-cyan-700"  style="opacity: 0.6; cursor: not-allowed;">
   {% else %}
      <a href="{{ column.attrs.url }}{{ record.id }}" class="inline-flex items-center rounded bg-cyan-600 px-4 py-2 text-white hover:bg-cyan-700">
    {% endif %}
          <i class="icon-edit-sign icon-white"></i>
    {% trans "Edit" %}
      </a>
{% else %}
    {% trans "Not allowed" %}
{% endif %}
