{% load static i18n %}
{% load custom_tags %}
{% load util_tags %}
<script src='https://kit.fontawesome.com/a076d05399.js'></script>

{% if record.is_justified %}
   <button class="inline-flex items-center rounded bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-700 justify-button-stopped" itemscope="{{ record.id }}" id="justify_button_{{ record.id }}" translation="{% trans "Are you sure you want to un justify this student ?" %}">
      <i class="fas fa-user-check icon-green"></i>&nbsp;&nbsp;
       <small>
         {% trans "Justified " %}
       </small>

   </button>
{% else %}
    <button class="inline-flex items-center rounded bg-red-600 px-4 py-2 text-white hover:bg-red-700 justify-button" itemscope="{{ record.id }}" id="justify_button_{{ record.id }}" translation="{% trans "Are you sure you want to justify this student ?" %}">
      <i class="fas fa-user-alt-slash icon-red"></i>&nbsp;&nbsp;
       <small>
         {% trans "Not Justified " %}
       </small>

   </button>
{% endif %}
